<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'">
<title>Job Tracker</title>
<style>
:root {
  color-scheme: light;
  --bg: #f6f5f2; --surface: #fcfcfb; --surface-2: #f0efeb; --line: #e2e0da; --line-strong: #cfccc4;
  --text: #121211; --text-2: #52514e; --text-3: #7a7973;
  --accent: #2a78d6; --accent-ink: #ffffff; --focus: #2a78d6;
  --st-new: #8a8984; --st-think: #eda100; --st-prep: #6250d6; --st-applied: #2a78d6; --st-assess: #1baf7a;
  --st-interview: #e87ba4; --st-offer: #008300; --st-rejected: #e34948; --st-declined: #b5b3ab; --st-closed: #b5b3ab;
  --hi: #e3f1e3; --hi-ink: #145c14; --md: #fdf2d6; --md-ink: #7a5300; --lo: #f8e1e1; --lo-ink: #8f2a2a;
  --shadow: 0 1px 2px rgba(0,0,0,.05), 0 4px 16px rgba(0,0,0,.05);
  --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #121211; --surface: #1a1a19; --surface-2: #232321; --line: #2e2e2b; --line-strong: #3d3d39;
    --text: #f0efec; --text-2: #c3c2b7; --text-3: #8f8e86;
    --accent: #3987e5; --focus: #6da7ec;
    --st-new: #8f8e86; --st-think: #c98500; --st-prep: #9085e9; --st-applied: #3987e5; --st-assess: #199e70;
    --st-interview: #d55181; --st-offer: #0ca30c; --st-rejected: #e66767; --st-declined: #5a5954; --st-closed: #5a5954;
    --hi: #183318; --hi-ink: #8fd88f; --md: #3a2e0f; --md-ink: #f0c661; --lo: #3d1c1c; --lo-ink: #f2a3a3;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #121211; --surface: #1a1a19; --surface-2: #232321; --line: #2e2e2b; --line-strong: #3d3d39;
  --text: #f0efec; --text-2: #c3c2b7; --text-3: #8f8e86;
  --accent: #3987e5; --focus: #6da7ec;
  --st-new: #8f8e86; --st-think: #c98500; --st-prep: #9085e9; --st-applied: #3987e5; --st-assess: #199e70;
  --st-interview: #d55181; --st-offer: #0ca30c; --st-rejected: #e66767; --st-declined: #5a5954; --st-closed: #5a5954;
  --hi: #183318; --hi-ink: #8fd88f; --md: #3a2e0f; --md-ink: #f0c661; --lo: #3d1c1c; --lo-ink: #f2a3a3;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25);
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--text); font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
button, input, select { font: inherit; color: inherit; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.hidden { display: none !important; }
.num { font-variant-numeric: tabular-nums; }

/* unlock */
#lock { min-height: 100vh; display: grid; place-items: center; padding: 16px; }
.lock-card { width: 100%; max-width: 380px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 28px; box-shadow: var(--shadow); }
.lock-card h1 { font-size: 20px; margin: 0 0 4px; letter-spacing: -.01em; }
.lock-card p { color: var(--text-2); margin: 0 0 18px; }
.field { display: block; width: 100%; padding: 10px 12px; border: 1px solid var(--line-strong); border-radius: 8px; background: var(--surface); }
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: 8px; border: 1px solid var(--line-strong); background: var(--surface); cursor: pointer; white-space: nowrap; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.06); }
.btn.small { padding: 4px 10px; font-size: 13px; }
.lock-row { display: flex; align-items: center; gap: 8px; margin: 12px 0 16px; color: var(--text-2); font-size: 13px; }
.err { color: var(--st-rejected); font-size: 13px; min-height: 20px; margin-top: 8px; }

/* shell */
header.top { position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.top-inner { max-width: 1240px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.brand { font-weight: 650; letter-spacing: -.01em; }
.brand small { display: block; font-weight: 400; color: var(--text-3); font-size: 12px; }
nav.tabs { display: flex; gap: 2px; background: var(--surface-2); padding: 3px; border-radius: 9px; }
nav.tabs button { border: 0; background: transparent; padding: 6px 12px; border-radius: 7px; cursor: pointer; color: var(--text-2); }
nav.tabs button[aria-selected="true"] { background: var(--surface); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
.top-actions { margin-left: auto; display: flex; gap: 6px; }
main { max-width: 1240px; margin: 0 auto; padding: 20px 16px 60px; }
h2 { font-size: 15px; margin: 0 0 12px; letter-spacing: -.005em; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; }
.grid { display: grid; gap: 14px; }
.muted { color: var(--text-3); }
.sub { color: var(--text-2); }

/* overview */
.kpis { grid-template-columns: repeat(6, minmax(0, 1fr)); }
.kpi { cursor: pointer; text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: var(--radius); padding: 14px; }
.kpi:hover { border-color: var(--line-strong); }
.kpi .lbl { color: var(--text-2); font-size: 12.5px; display: flex; align-items: center; gap: 6px; }
.kpi .val { font-size: 28px; font-weight: 650; letter-spacing: -.02em; line-height: 1.2; margin-top: 4px; }
.kpi .hint { color: var(--text-3); font-size: 12px; }
.two { grid-template-columns: 1.3fr 1fr; margin-top: 14px; }
.stage-row { display: grid; grid-template-columns: 150px 1fr 40px; align-items: center; gap: 10px; padding: 5px 0; cursor: pointer; border-radius: 6px; }
.stage-row:hover .bar-track { background: var(--line); }
.bar-track { height: 10px; background: var(--surface-2); border-radius: 4px; overflow: hidden; }
.bar { height: 100%; border-radius: 0 4px 4px 0; min-width: 2px; }
.stage-row .n { text-align: right; color: var(--text-2); }
.list { list-style: none; margin: 0; padding: 0; }
.list li { padding: 9px 0; border-top: 1px solid var(--line); display: flex; gap: 10px; align-items: flex-start; cursor: pointer; }
.list li:first-child { border-top: 0; }
.list li:hover .t { text-decoration: underline; }
.list .t { font-weight: 550; }
.list .meta { color: var(--text-3); font-size: 12.5px; }
.empty { color: var(--text-3); padding: 12px 0; }

/* pills */
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px 2px 7px; border-radius: 999px; font-size: 12.5px; background: var(--surface-2); color: var(--text); white-space: nowrap; border: 1px solid var(--line); }
.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; display: inline-block; }
.fit { display: inline-block; min-width: 34px; text-align: center; padding: 1px 6px; border-radius: 6px; font-size: 12.5px; font-weight: 600; }
.fit.High { background: var(--hi); color: var(--hi-ink); }
.fit.Medium { background: var(--md); color: var(--md-ink); }
.fit.Low { background: var(--lo); color: var(--lo-ink); }
.chip { display: inline-block; padding: 1px 8px; border-radius: 6px; font-size: 12.5px; margin: 2px 4px 2px 0; border: 1px solid var(--line); background: var(--surface-2); }
.chip.ok { background: var(--hi); color: var(--hi-ink); border-color: transparent; }
.chip.miss { background: var(--lo); color: var(--lo-ink); border-color: transparent; }

/* filters */
.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
.filters .field { width: auto; padding: 7px 10px; }
.filters input[type=search] { flex: 1 1 240px; min-width: 180px; }
.seg { display: inline-flex; border: 1px solid var(--line-strong); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: var(--surface); padding: 7px 11px; cursor: pointer; color: var(--text-2); }
.seg button + button { border-left: 1px solid var(--line-strong); }
.seg button[aria-pressed="true"] { background: var(--text); color: var(--bg); }
.stage-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.stage-chips button { cursor: pointer; }
.stage-chips button[aria-pressed="true"] { border-color: var(--text); box-shadow: inset 0 0 0 1px var(--text); }
.count-line { color: var(--text-3); font-size: 13px; margin: 0 0 8px; display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
.linkbtn { border: 0; background: none; color: var(--accent); cursor: pointer; padding: 0; }

/* table */
.table-wrap { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: auto; }
table { width: 100%; border-collapse: collapse; }
th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 12px; color: var(--text-2); font-weight: 600; background: var(--surface-2); position: sticky; top: 0; cursor: pointer; user-select: none; white-space: nowrap; }
th[aria-sort="ascending"]::after { content: " ▲"; font-size: 9px; }
th[aria-sort="descending"]::after { content: " ▼"; font-size: 9px; }
tbody tr { cursor: pointer; }
tbody tr:hover { background: var(--surface-2); }
td .co { font-weight: 600; }
td .role { color: var(--text-2); }
td.date { white-space: nowrap; color: var(--text-2); }
.soon { color: var(--st-rejected); font-weight: 600; }
.more { display: block; margin: 14px auto 0; }
.cards-mobile { display: none; }

/* detail drawer */
#drawer { position: fixed; inset: 0; z-index: 20; display: flex; justify-content: flex-end; background: rgba(0,0,0,.28); }
#drawer .panel { width: min(640px, 100%); height: 100%; overflow: auto; background: var(--surface); border-left: 1px solid var(--line); padding: 22px 24px 40px; box-shadow: var(--shadow); }
.panel h3 { margin: 0; font-size: 19px; letter-spacing: -.01em; }
.panel .co-line { color: var(--text-2); margin: 2px 0 12px; font-size: 15px; }
.facts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 16px; margin: 14px 0; }
.facts div span { display: block; color: var(--text-3); font-size: 12px; }
.panel section { margin-top: 18px; }
.panel section h4 { margin: 0 0 6px; font-size: 13px; color: var(--text-2); text-transform: uppercase; letter-spacing: .04em; }
.panel ul { margin: 0; padding-left: 18px; }
.panel li { margin: 3px 0; }
.timeline { list-style: none; padding: 0 !important; border-left: 2px solid var(--line); margin-left: 4px !important; }
.timeline li { position: relative; padding-left: 16px; margin: 0 0 10px !important; }
.timeline li::before { content: ""; position: absolute; left: -6px; top: 6px; width: 10px; height: 10px; border-radius: 50%; background: var(--dotc, var(--line-strong)); border: 2px solid var(--surface); }
.note { background: var(--surface-2); border-radius: 8px; padding: 10px 12px; white-space: pre-wrap; }
.drawer-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }

/* calendar */
.cal-head { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
.cal-head h2 { margin: 0 8px 0 0; min-width: 150px; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; color: var(--text-2); font-size: 13px; margin-left: auto; }
.legend span { display: inline-flex; gap: 6px; align-items: center; }
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; background: var(--line); gap: 1px; }
.cal .dow { background: var(--surface-2); padding: 6px 8px; font-size: 12px; color: var(--text-2); font-weight: 600; }
.cal .day { background: var(--surface); min-height: 104px; padding: 6px; display: flex; flex-direction: column; gap: 3px; }
.cal .day.other { background: var(--surface-2); }
.cal .day.other .d { color: var(--text-3); }
.cal .day .d { font-size: 12px; color: var(--text-2); }
.cal .day.today .d { background: var(--accent); color: var(--accent-ink); border-radius: 999px; width: 22px; height: 22px; display: grid; place-items: center; font-weight: 600; }
.ev { display: flex; gap: 5px; align-items: center; font-size: 12px; padding: 2px 5px; border-radius: 5px; background: var(--surface-2); cursor: pointer; border: 0; text-align: left; width: 100%; overflow: hidden; }
.ev:hover { background: var(--line); }
.ev .txt { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ev-more { font-size: 12px; color: var(--text-3); border: 0; background: none; text-align: left; cursor: pointer; padding: 0 5px; }
.agenda { margin-top: 16px; }

/* updates */
.feed li { cursor: pointer; }
.src { font-size: 12px; color: var(--text-3); }
.person-seg button { padding: 5px 14px; font-weight: 550; }
.person-seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.callout { border: 1px solid var(--line); background: var(--surface-2); border-radius: var(--radius); padding: 12px 14px; color: var(--text-2); font-size: 13.5px; margin-bottom: 14px; }

@media (max-width: 980px) {
  .kpis { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .two { grid-template-columns: 1fr; }
}
@media (max-width: 680px) {
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .top-inner { gap: 10px; }
  nav.tabs { order: 3; width: 100%; overflow-x: auto; }
  nav.tabs button { flex: 1; }
  .table-wrap { display: none; }
  .cards-mobile { display: block; }
  .cards-mobile .card { margin-bottom: 8px; cursor: pointer; }
  .stage-row { grid-template-columns: 110px 1fr 32px; }
  .cal .day { min-height: 64px; padding: 3px; }
  .ev .txt { display: none; }
  .ev { justify-content: center; padding: 3px; }
  .facts { grid-template-columns: 1fr; }
  #drawer .panel { padding: 18px 16px 40px; }
}
@media print { header.top, .filters, .stage-chips { display: none; } }
</style>
</head>
<body>

<div id="lock">
  <form class="lock-card" id="lockForm" autocomplete="off">
    <h1>Job Tracker</h1>
    <p>Your applications are encrypted. Enter your passphrase to open them.</p>
    <label for="pw" class="sub" style="font-size:13px">Passphrase</label>
    <input class="field" id="pw" type="password" autocomplete="current-password" required autofocus>
    <label class="lock-row"><input type="checkbox" id="remember"> Remember on this device</label>
    <button class="btn primary" style="width:100%;justify-content:center" id="unlockBtn">Unlock</button>
    <div class="err" id="lockErr" role="alert"></div>
  </form>
</div>

<div id="app" class="hidden">
  <header class="top">
    <div class="top-inner">
      <div class="brand">Job Tracker<small id="genLine"></small></div>
      <div class="seg person-seg hidden" id="personSeg" role="group" aria-label="Whose jobs to show"></div>
      <nav class="tabs" role="tablist">
        <button role="tab" data-tab="overview" aria-selected="true">Overview</button>
        <button role="tab" data-tab="jobs" aria-selected="false">Jobs</button>
        <button role="tab" data-tab="calendar" aria-selected="false">Calendar</button>
        <button role="tab" data-tab="updates" aria-selected="false">Updates</button>
      </nav>
      <div class="top-actions">
        <button class="btn small" id="themeBtn" title="Switch light / dark">◐</button>
        <button class="btn small" id="lockBtn" title="Lock and forget this device">Lock</button>
      </div>
    </div>
  </header>
  <main>
    <section id="tab-overview"></section>
    <section id="tab-jobs" class="hidden"></section>
    <section id="tab-calendar" class="hidden"></section>
    <section id="tab-updates" class="hidden"></section>
  </main>
</div>

<div id="drawer" class="hidden" role="dialog" aria-modal="true" aria-labelledby="dTitle"><div class="panel" id="drawerPanel"></div></div>

<script>
"use strict";
/* ---------------------------------------------------------------- safety helpers
   Every job field is scraped text from the internet: always escape it, and only link http(s) URLs. */
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const safeUrl = u => { try { const x = new URL(u); return (x.protocol === "https:" || x.protocol === "http:") ? x.href : ""; } catch { return ""; } };
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
  del(k) { try { localStorage.removeItem(k); } catch {} },
};
const $ = s => document.querySelector(s);

/* ---------------------------------------------------------------- stages */
const STAGES = [
  {key: "Offer",      label: "Offer",          icon: "🎉", color: "--st-offer",     group: "applied"},
  {key: "Interview",  label: "Interviewing",   icon: "📞", color: "--st-interview", group: "applied"},
  {key: "Assessment", label: "Assessment",     icon: "📝", color: "--st-assess",    group: "applied"},
  {key: "Applied",    label: "Applied · waiting", icon: "📨", color: "--st-applied", group: "applied"},
  {key: "Prepared",   label: "Ready to submit", icon: "📦", color: "--st-prep",     group: "preparing"},
  {key: "Approved",   label: "Preparing",      icon: "🚀", color: "--st-prep",      group: "preparing"},
  {key: "Thinking",   label: "Considering",    icon: "🤔", color: "--st-think",     group: "open"},
  {key: "New",        label: "Not applied",    icon: "•",  color: "--st-new",       group: "open"},
  {key: "Rejected",   label: "Rejected",       icon: "✖", color: "--st-rejected",  group: "done"},
  {key: "Declined",   label: "Skipped",        icon: "⤼", color: "--st-declined",  group: "done"},
  {key: "Expired",    label: "Expired",        icon: "⌛", color: "--st-closed",    group: "done"},
  {key: "Closed",     label: "Posting closed", icon: "🔒", color: "--st-closed",    group: "done"},
];
const STAGE = Object.fromEntries(STAGES.map(s => [s.key, s]));
const stageOf = j => STAGE[j.status] || STAGE.New;
const APPLIED = new Set(["Applied", "Assessment", "Interview", "Offer", "Rejected"]);
const ACTIVE = new Set(["Applied", "Assessment", "Interview"]);
const pill = j => { const s = stageOf(j); return `<span class="pill"><span class="dot" style="background:var(${s.color})"></span>${esc(s.label)}</span>`; };
const fit = j => j.score == null ? `<span class="muted">—</span>` : `<span class="fit ${esc(j.label)}" title="${esc(j.label)} fit">${esc(j.score)}</span>`;

/* ---------------------------------------------------------------- dates (shown in your own time zone) */
const today = () => { const d = new Date(); d.setHours(0,0,0,0); return d; };
const parseDay = s => { if (!s) return null; const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s); if (!m) return null; if (s.length > 10 && /T/.test(s)) { const d = new Date(s); return isNaN(d) ? null : d; } return new Date(+m[1], +m[2]-1, +m[3]); };
const dayKey = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const fmtDay = s => { const d = parseDay(s); return d ? d.toLocaleDateString(undefined, {month: "short", day: "numeric", year: d.getFullYear() === new Date().getFullYear() ? undefined : "numeric"}) : ""; };
const fmtTime = s => { const d = parseDay(s); return d && /T/.test(s) ? d.toLocaleString(undefined, {month: "short", day: "numeric", hour: "numeric", minute: "2-digit"}) : fmtDay(s); };
const daysFrom = s => { const d = parseDay(s); if (!d) return null; const x = new Date(d); x.setHours(0,0,0,0); return Math.round((x - today()) / 864e5); };
const ago = s => { const n = daysFrom(s); if (n == null) return ""; if (n === 0) return "today"; if (n === -1) return "yesterday"; return n < 0 ? `${-n} days ago` : `in ${n} days`; };

/* ---------------------------------------------------------------- decrypt */
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const KEY_STORE = "jt.key.v1";
let ENV = null, DATA = null, JOBS = [], BY_ID = {};

async function fetchEnvelope() {
  const r = await fetch("data.enc.json", {cache: "no-store"});
  if (!r.ok) throw new Error("Could not load data.enc.json (" + r.status + ")");
  return r.json();
}
async function deriveRaw(pass, env) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveBits"]);
  return new Uint8Array(await crypto.subtle.deriveBits({name: "PBKDF2", hash: "SHA-256", salt: b64(env.salt), iterations: env.iter}, base, 256));
}
async function openWithRaw(raw, env) {
  const key = await crypto.subtle.importKey("raw", raw, "AES-GCM", false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({name: "AES-GCM", iv: b64(env.iv)}, key, b64(env.ct));
  const text = await new Response(new Blob([plain]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
  return JSON.parse(text);
}
const hex = u8 => Array.from(u8, b => b.toString(16).padStart(2, "0")).join("");
const unhex = h => new Uint8Array(h.match(/../g).map(x => parseInt(x, 16)));

async function tryRemembered() {
  const saved = store.get(KEY_STORE);
  if (!saved) return false;
  try {
    const {salt, iter, key} = JSON.parse(saved);
    if (salt !== ENV.salt || iter !== ENV.iter) { store.del(KEY_STORE); return false; }   // passphrase or salt changed
    start(await openWithRaw(unhex(key), ENV));
    return true;
  } catch { store.del(KEY_STORE); return false; }
}

$("#lockForm").addEventListener("submit", async e => {
  e.preventDefault();
  const btn = $("#unlockBtn"), err = $("#lockErr");
  btn.disabled = true; btn.textContent = "Unlocking…"; err.textContent = "";
  try {
    ENV = ENV || await fetchEnvelope();
    const raw = await deriveRaw($("#pw").value, ENV);
    const data = await openWithRaw(raw, ENV);
    if ($("#remember").checked) store.set(KEY_STORE, JSON.stringify({salt: ENV.salt, iter: ENV.iter, key: hex(raw)}));
    $("#pw").value = "";
    start(data);
  } catch (x) {

});

/* ---------------------------------------------------------------- calendar */
const EV = {
  interview: {label: "Interview", color: "--st-interview", icon: "📞"},
  deadline:  {label: "Deadline (not applied)", color: "--st-think", icon: "⏰"},
  applied:   {label: "Applied", color: "--st-applied", icon: "📨"},
  update:    {label: "Status change", color: "--st-assess", icon: "↻"},
};
function events() {
  const out = [];
  for (const j of JOBS) {
    if (j.interview_at) out.push({d: j.interview_at, t: "interview", j});
    if (j.deadline && !APPLIED.has(j.status) && j.status !== "Declined" && !j.closed) out.push({d: j.deadline, t: "deadline", j});
    if (j.applied) out.push({d: j.applied, t: "applied", j});
    if (j.changed && ["Assessment", "Interview", "Offer", "Rejected"].includes(j.status)) out.push({d: j.changed, t: "update", j});
  }
  return out.map(e => ({...e, day: parseDay(e.d)})).filter(e => e.day);
}
function renderCalendar() {
  const evs = events(), byDay = {};
  for (const e of evs) (byDay[dayKey(e.day)] ||= []).push(e);
  const order = {interview: 0, deadline: 1, update: 2, applied: 3};
  Object.values(byDay).forEach(l => l.sort((a, b) => order[a.t] - order[b.t]));
  const first = new Date(calMonth), startDay = new Date(first); startDay.setDate(1 - ((first.getDay() + 6) % 7));
  const cells = [];
  for (let i = 0; i < 42; i++) { const d = new Date(startDay); d.setDate(startDay.getDate() + i); cells.push(d); if (i >= 34 && d.getMonth() !== first.getMonth() && d.getDay() === 0) break; }
  const tk = dayKey(today());
  const upcoming = evs.filter(e => e.day >= today() && (e.t === "interview" || e.t === "deadline")).sort((a, b) => a.day - b.day).slice(0, 12);
  const hasInterviewTimes = JOBS.some(j => j.interview_at);
  const note = hasInterviewTimes ? "" : usesCareerOps()
    ? "Interview times show up here when Career Ops reads an invite and sends the time. Until then the calendar shows applications, deadlines and status changes."
    : `Interview times aren't tracked for ${WHO.name} (that comes from Career Ops). The calendar shows applications, deadlines and status changes.`;
  $("#tab-calendar").innerHTML = `
    ${note ? `<div class="callout">${esc(note)}</div>` : ""}
    <div class="cal-head">
      <h2>${first.toLocaleDateString(undefined, {month: "long", year: "numeric"})}</h2>
      <button class="btn small" id="cPrev" aria-label="Previous month">‹</button>
      <button class="btn small" id="cToday">Today</button>
      <button class="btn small" id="cNext" aria-label="Next month">›</button>
      <div class="legend">${Object.values(EV).map(v => `<span><span class="dot" style="background:var(${v.color})"></span>${v.label}</span>`).join("")}</div>
    </div>
    <div class="cal">
      ${["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].map(d => `<div class="dow">${d}</div>`).join("")}
      ${cells.map(d => { const k = dayKey(d), l = byDay[k] || [];
        return `<div class="day ${d.getMonth() !== first.getMonth() ? "other" : ""} ${k === tk ? "today" : ""}"><span class="d">${d.getDate()}</span>
          ${l.slice(0, 3).map(e => `<button class="ev" data-id="${esc(e.j.id)}" title="${esc(EV[e.t].label + ": " + e.j.company + " — " + e.j.role)}"><span class="dot" style="background:var(${EV[e.t].color})"></span><span class="txt">${esc(e.j.company)}</span></button>`).join("")}
          ${l.length > 3 ? `<button class="ev-more" data-day="${k}">+${l.length - 3} more</button>` : ""}</div>`; }).join("")}
    </div>
    <div class="card agenda"><h2 id="agendaTitle">Coming up</h2><ul class="list" id="agenda">${agendaItems(upcoming) || `<li class="empty">No upcoming interviews or deadlines.</li>`}</ul></div>`;
  $("#cPrev").addEventListener("click", () => { calMonth.setMonth(calMonth.getMonth() - 1); renderCalendar(); });
  $("#cNext").addEventListener("click", () => { calMonth.setMonth(calMonth.getMonth() + 1); renderCalendar(); });
  $("#cToday").addEventListener("click", () => { calMonth = today(); calMonth.setDate(1); renderCalendar(); });
  $("#tab-calendar").querySelectorAll(".ev-more").forEach(b => b.addEventListener("click", () => {
    const l = byDay[b.dataset.day]; $("#agendaTitle").textContent = fmtDay(b.dataset.day);
    $("#agenda").innerHTML = agendaItems(l); bindOpen($("#agenda")); $("#agenda").scrollIntoView({behavior: "smooth", block: "nearest"});
  }));
  bindOpen($("#tab-calendar"));
}
function agendaItems(l) {
  return l.map(e => `<li data-id="${esc(e.j.id)}"><span class="dot" style="background:var(${EV[e.t].color});margin-top:7px"></span><div><div class="t">${esc(e.j.company)}</div><div class="meta">${esc(e.j.role)}</div><div class="sub" style="font-size:13px">${esc(EV[e.t].label)} · ${esc(e.t === "interview" ? fmtTime(e.d) : fmtDay(e.d))} (${esc(ago(e.d))})</div></div></li>`).join("");
}

/* ---------------------------------------------------------------- updates */
let updSrc = "all";
const usesCareerOps = () => JOBS.some(j => j.src === "careerops" || j.interview_at);
function renderUpdates() {
  const all = JOBS.filter(j => j.changed && j.status !== "New").sort((a, b) => b.changed.localeCompare(a.changed));
  const list = all.filter(j => updSrc === "all" || (updSrc === "careerops" ? j.src === "careerops" : j.src !== "careerops"));
  const fromCo = all.filter(j => j.src === "careerops").length;
  const co = usesCareerOps();
  const intro = co
    ? `Every status change, newest first. Career Ops reads ${WHO.name}'s Gmail and auto-apply runs, then updates the sheet; ${WHO.name}'s own ✅ ❌ 🤔 📞 🎉 reactions on Discord show here too.`
    : `Every status change, newest first, from ${WHO.name}'s ✅ ❌ 🤔 📞 🎉 reactions on Discord.`;
  $("#tab-updates").innerHTML = `
    <div class="callout">${esc(intro)} This page refreshes when the tracker rebuilds it (every 15 minutes, when something changed).</div>
    ${co ? `<div class="filters"><div class="seg" role="group" aria-label="Source">
      ${[["all", `All (${all.length})`], ["careerops", `From Career Ops (${fromCo})`], ["me", `From ${esc(WHO.name)} (${all.length - fromCo})`]].map(([k, l]) => `<button data-src="${k}" aria-pressed="${updSrc === k}">${l}</button>`).join("")}
    </div></div>` : ""}
    <div class="card">${list.length ? `<ul class="list feed">${list.map(feedItem).join("")}</ul>` : `<div class="empty">No updates from this source yet.</div>`}</div>`;
  $("#tab-updates").querySelectorAll("[data-src]").forEach(b => b.addEventListener("click", () => { updSrc = b.dataset.src; renderUpdates(); }));
  bindOpen($("#tab-updates"));
}

/* ---------------------------------------------------------------- boot */
(async () => {
  try { ENV = await fetchEnvelope(); if (await tryRemembered()) return; }
  catch (x) { $("#lockErr").textContent = x.message; }
})();
</script>
</body>
</html>
